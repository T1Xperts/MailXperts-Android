plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('MX_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('MX_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('MX_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MX_KEY_PASSWORD')
def releaseSigningReady = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }

android {
    namespace 'au.com.t1xperts.mailxperts'
    compileSdk 36

    defaultConfig {
        applicationId 'au.com.t1xperts.mailxperts'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '1.5.1'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    testImplementation 'junit:junit:4.13.2'
}

gradle.taskGraph.whenReady { graph ->
    boolean releaseRequested = graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' }
    if (releaseRequested && !releaseSigningReady) {
        throw new GradleException('Release signing is not configured. Set MX_KEYSTORE_FILE, MX_KEYSTORE_PASSWORD, MX_KEY_ALIAS and MX_KEY_PASSWORD.')
    }
}
