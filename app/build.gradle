plugins {
    id 'com.android.application'
}

def releaseKeystore = System.getenv('MX_KEYSTORE_FILE')
def releaseStorePassword = System.getenv('MX_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('MX_KEY_ALIAS')
def releaseKeyPassword = System.getenv('MX_KEY_PASSWORD')
def releaseSigningReady = [releaseKeystore, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it != null && !it.trim().isEmpty() }
def allowUnsignedRelease = 'true'.equalsIgnoreCase(System.getenv('MX_ALLOW_UNSIGNED_RELEASE'))

def microsoftClientId = System.getenv('MX_MICROSOFT_CLIENT_ID') ?: ''
def microsoftRedirectUri = System.getenv('MX_MICROSOFT_REDIRECT_URI')
if (microsoftRedirectUri == null || microsoftRedirectUri.trim().isEmpty()) {
    microsoftRedirectUri = microsoftClientId.trim().isEmpty()
            ? 'msal-unconfigured://auth'
            : "msal${microsoftClientId}://auth"
}
def microsoftRedirectScheme = microsoftRedirectUri.contains(':')
        ? microsoftRedirectUri.substring(0, microsoftRedirectUri.indexOf(':'))
        : 'msal-unconfigured'
def javaString = { String value -> '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"' }

android {
    namespace 'au.com.t1xperts.mailxperts'
    compileSdk 36

    defaultConfig {
        applicationId 'au.com.t1xperts.mailxperts'
        minSdk 26
        targetSdk 36
        versionCode 21
        versionName '1.6.0-beta.7'

        buildConfigField 'String', 'MX_MICROSOFT_CLIENT_ID', javaString(microsoftClientId)
        buildConfigField 'String', 'MX_MICROSOFT_REDIRECT_URI', javaString(microsoftRedirectUri)
        manifestPlaceholders = [appAuthRedirectScheme: microsoftRedirectScheme]
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystore)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.dev'
            versionNameSuffix '-dev'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigningReady) signingConfig signingConfigs.release
        }
    }

    packaging {
        resources {
            excludes += ['META-INF/LICENSE.md', 'META-INF/NOTICE.md', 'META-INF/LICENSE', 'META-INF/NOTICE']
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'androidx.core:core:1.17.0'
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    implementation 'net.openid:appauth:0.11.1'
    testImplementation 'junit:junit:4.13.2'
}

gradle.taskGraph.whenReady { graph ->
    boolean releaseRequested = graph.allTasks.any { it.name == 'assembleRelease' || it.name == 'bundleRelease' }
    if (releaseRequested && !releaseSigningReady && !allowUnsignedRelease) {
        throw new GradleException('Release signing is not configured. Set MX_KEYSTORE_FILE, MX_KEYSTORE_PASSWORD, MX_KEY_ALIAS and MX_KEY_PASSWORD, or set MX_ALLOW_UNSIGNED_RELEASE=true for a non-distributable unsigned CI artifact.')
    }
}
