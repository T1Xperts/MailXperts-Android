name: Bulk Messenger P0 Android

on:
  push:
    branches: [ bulk-messenger-p0-build ]
    paths:
      - 'smsapp/**'
      - 'settings.gradle'
      - '.github/workflows/bulk-sms-p0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Build debug APK
        run: ./gradlew :smsapp:assembleDebug --stacktrace
      - name: Copy APK
        run: cp smsapp/build/outputs/apk/debug/smsapp-debug.apk T1Xperts-Bulk-Messenger-P0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: T1Xperts-Bulk-Messenger-P0
          path: T1Xperts-Bulk-Messenger-P0.apk
          if-no-files-found: error
