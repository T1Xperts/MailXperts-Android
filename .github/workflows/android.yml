name: Build MailXperts Android

"on":
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mailxperts-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and build development APK
        run: ./gradlew --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug
      - name: Verify, name and checksum APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk MailXperts-v1.4.1-debug.apk
          apksigner verify --verbose --print-certs MailXperts-v1.4.1-debug.apk
          aapt dump badging MailXperts-v1.4.1-debug.apk | grep -F "package: name='au.com.t1xperts.mailxperts.dev' versionCode='8' versionName='1.4.1-dev'"
          sha256sum MailXperts-v1.4.1-debug.apk > SHA256SUMS-v1.4.1-debug.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MailXperts-v1.4.1-debug-apk
          path: |
            MailXperts-v1.4.1-debug.apk
            SHA256SUMS-v1.4.1-debug.txt
          if-no-files-found: error
          retention-days: 30

  signed-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release keystore
        env:
          MX_KEYSTORE_BASE64: ${{ secrets.MX_KEYSTORE_BASE64 }}
        run: |
          test -n "$MX_KEYSTORE_BASE64"
          printf '%s' "$MX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mailxperts-release.p12"
      - name: Build signed release APK and Android App Bundle
        env:
          MX_KEYSTORE_FILE: ${{ runner.temp }}/mailxperts-release.p12
          MX_KEYSTORE_PASSWORD: ${{ secrets.MX_KEYSTORE_PASSWORD }}
          MX_KEY_ALIAS: ${{ secrets.MX_KEY_ALIAS }}
          MX_KEY_PASSWORD: ${{ secrets.MX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean lintRelease assembleRelease bundleRelease
      - name: Verify release signature and version
        run: |
          apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab
          aapt dump badging app/build/outputs/apk/release/app-release.apk | grep "versionCode='8' versionName='1.4.1'"
          cp app/build/outputs/apk/release/app-release.apk MailXperts-v1.4.1.apk
          cp app/build/outputs/bundle/release/app-release.aab MailXperts-v1.4.1.aab
      - uses: actions/upload-artifact@v4
        with:
          name: MailXperts-v1.4.1-signed-release
          path: |
            MailXperts-v1.4.1.apk
            MailXperts-v1.4.1.aab
          if-no-files-found: error
      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" MailXperts-v1.4.1.apk MailXperts-v1.4.1.aab --title "MailXperts $GITHUB_REF_NAME" --generate-notes
