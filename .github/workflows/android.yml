name: Build MailXperts Android

"on":
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mailxperts-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate and build development APK
        run: ./gradlew --no-daemon --stacktrace clean lintDebug testDebugUnitTest assembleDebug
      - name: Verify, name and checksum APK
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          cp app/build/outputs/apk/debug/app-debug.apk MailXperts-v1.5.2-debug.apk
          "$build_tools/apksigner" verify --verbose --print-certs MailXperts-v1.5.2-debug.apk
          "$build_tools/aapt" dump badging MailXperts-v1.5.2-debug.apk | grep -F "package: name='au.com.t1xperts.mailxperts.dev' versionCode='12' versionName='1.5.2-dev'"
          sha256sum MailXperts-v1.5.2-debug.apk > SHA256SUMS-v1.5.2-debug.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MailXperts-v1.5.2-debug-apk
          path: |
            MailXperts-v1.5.2-debug.apk
            SHA256SUMS-v1.5.2-debug.txt
          if-no-files-found: error
          retention-days: 30

  signed-release:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v1.5.2]'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Detect and restore release signing material
        id: signing
        env:
          MX_KEYSTORE_BASE64: ${{ secrets.MX_KEYSTORE_BASE64 }}
          MX_KEYSTORE_PASSWORD: ${{ secrets.MX_KEYSTORE_PASSWORD }}
          MX_KEY_ALIAS: ${{ secrets.MX_KEY_ALIAS }}
          MX_KEY_PASSWORD: ${{ secrets.MX_KEY_PASSWORD }}
        run: |
          if [[ -n "$MX_KEYSTORE_BASE64" && -n "$MX_KEYSTORE_PASSWORD" && -n "$MX_KEY_ALIAS" && -n "$MX_KEY_PASSWORD" ]]; then
            printf '%s' "$MX_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mailxperts-release.p12"
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets are not configured. Building a non-distributable unsigned release artifact for secure offline signing."
          fi

      - name: Build signed release APK and Android App Bundle
        if: steps.signing.outputs.available == 'true'
        env:
          MX_KEYSTORE_FILE: ${{ runner.temp }}/mailxperts-release.p12
          MX_KEYSTORE_PASSWORD: ${{ secrets.MX_KEYSTORE_PASSWORD }}
          MX_KEY_ALIAS: ${{ secrets.MX_KEY_ALIAS }}
          MX_KEY_PASSWORD: ${{ secrets.MX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon clean lintRelease testDebugUnitTest assembleRelease bundleRelease

      - name: Verify signed release signature, version and checksums
        if: steps.signing.outputs.available == 'true'
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -strict app/build/outputs/bundle/release/app-release.aab
          "$build_tools/aapt" dump badging app/build/outputs/apk/release/app-release.apk | grep "versionCode='12' versionName='1.5.2'"
          cp app/build/outputs/apk/release/app-release.apk MailXperts-v1.5.2.apk
          cp app/build/outputs/bundle/release/app-release.aab MailXperts-v1.5.2.aab
          sha256sum MailXperts-v1.5.2.apk MailXperts-v1.5.2.aab > SHA256SUMS-v1.5.2.txt

      - name: Upload signed release artifact
        if: steps.signing.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MailXperts-v1.5.2-signed-release
          path: |
            MailXperts-v1.5.2.apk
            MailXperts-v1.5.2.aab
            SHA256SUMS-v1.5.2.txt
          if-no-files-found: error

      - name: Publish v1.5.2 GitHub release
        if: steps.signing.outputs.available == 'true' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v1.5.2"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" MailXperts-v1.5.2.apk MailXperts-v1.5.2.aab SHA256SUMS-v1.5.2.txt --clobber
          else
            gh release create "$tag" MailXperts-v1.5.2.apk MailXperts-v1.5.2.aab SHA256SUMS-v1.5.2.txt --target "$GITHUB_SHA" --title "MailXperts v1.5.2" --generate-notes
          fi

      - name: Build unsigned release fallback
        if: steps.signing.outputs.available != 'true'
        env:
          MX_ALLOW_UNSIGNED_RELEASE: 'true'
        run: ./gradlew --no-daemon clean lintRelease testDebugUnitTest assembleRelease

      - name: Verify and package unsigned release fallback
        if: steps.signing.outputs.available != 'true'
        run: |
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          "$build_tools/aapt" dump badging app/build/outputs/apk/release/app-release-unsigned.apk | grep "package: name='au.com.t1xperts.mailxperts' versionCode='12' versionName='1.5.2'"
          cp app/build/outputs/apk/release/app-release-unsigned.apk MailXperts-v1.5.2-unsigned.apk
          sha256sum MailXperts-v1.5.2-unsigned.apk > SHA256SUMS-v1.5.2-unsigned.txt

      - name: Upload unsigned release fallback
        if: steps.signing.outputs.available != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MailXperts-v1.5.2-unsigned-release
          path: |
            MailXperts-v1.5.2-unsigned.apk
            SHA256SUMS-v1.5.2-unsigned.txt
          if-no-files-found: error
          retention-days: 7
