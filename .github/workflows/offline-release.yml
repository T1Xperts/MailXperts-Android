name: Build MailXperts Offline-Signable Release

"on":
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  unsigned-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[offline-release ')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4

      - name: Read app version
        id: version
        shell: bash
        run: |
          version_name=$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\\([^']*\\)'.*/\\1/p" app/build.gradle | head -1)
          version_code=$(sed -n "s/^[[:space:]]*versionCode[[:space:]]*\\([0-9][0-9]*\\).*/\\1/p" app/build.gradle | head -1)
          [[ -n "$version_name" && -n "$version_code" ]] || { echo "Unable to read Android version" >&2; exit 1; }
          echo "name=$version_name" >> "$GITHUB_OUTPUT"
          echo "code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Build production APK for offline signing
        env:
          MX_ALLOW_UNSIGNED_RELEASE: 'true'
        run: ./gradlew --no-daemon --stacktrace clean lintRelease testDebugUnitTest assembleRelease

      - name: Verify production identity and package offline-signing kit
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
        run: |
          set -euo pipefail
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          apk="MailXperts-v${VERSION_NAME}-unsigned.apk"
          cp "$unsigned" "$apk"
          "$build_tools/aapt" dump badging "$apk" | grep -F "package: name='au.com.t1xperts.mailxperts' versionCode='${VERSION_CODE}' versionName='${VERSION_NAME}'"
          sha256sum "$apk" > "SHA256SUMS-v${VERSION_NAME}-unsigned.txt"

          mkdir -p signing-tools/lib
          cp "$build_tools/apksigner" signing-tools/
          cp "$build_tools/lib/apksigner.jar" signing-tools/lib/
          chmod +x signing-tools/apksigner
          cat > signing-tools/README.txt <<EOF
          Offline signing tools copied from Android Build Tools 36.0.0.
          Use only with the permanent MailXperts production signing key.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: MailXperts-v${{ steps.version.outputs.name }}-offline-signing-kit
          path: |
            MailXperts-v${{ steps.version.outputs.name }}-unsigned.apk
            SHA256SUMS-v${{ steps.version.outputs.name }}-unsigned.txt
            signing-tools/
          if-no-files-found: error
          retention-days: 7
