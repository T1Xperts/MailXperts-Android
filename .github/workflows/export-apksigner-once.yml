name: Export Android apksigner once

on:
  push:
    branches: [ feature/complete-p1-p2-backlog-batch ]
    paths:
      - '.github/workflows/export-apksigner-once.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36 build tools
        run: sdkmanager "build-tools;36.0.0"
      - name: Package apksigner runtime
        run: |
          set -euo pipefail
          mkdir -p apksigner-runtime/lib
          cp "$ANDROID_HOME/build-tools/36.0.0/apksigner" apksigner-runtime/
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner-runtime/lib/
          chmod +x apksigner-runtime/apksigner
      - uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-36-runtime
          path: apksigner-runtime
          if-no-files-found: error
          retention-days: 1
