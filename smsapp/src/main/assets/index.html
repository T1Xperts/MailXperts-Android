<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>T1Xperts Bulk Messenger</title>
<style>
:root{--ink:#0a1719;--muted:#607376;--teal:#0a7e86;--teal2:#0b9aa4;--deep:#062e33;--bg:#f4f8f8;--card:#fff;--line:#d9e5e6;--ok:#147d47;--warn:#9a6500;--bad:#b3261e;--shadow:0 8px 30px rgba(5,46,51,.09)}
*{box-sizing:border-box}body{margin:0;font-family:Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}.appbar{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,var(--deep),#084d54);color:#fff;padding:14px 16px;box-shadow:0 2px 12px rgba(0,0,0,.18)}.brand{font-size:19px;font-weight:800;letter-spacing:.2px}.tag{font-size:11px;opacity:.78;margin-top:2px}.nav{display:flex;gap:7px;overflow:auto;padding-top:12px}.nav button{white-space:nowrap;border:1px solid rgba(255,255,255,.2);color:#fff;background:rgba(255,255,255,.08);border-radius:999px;padding:8px 11px}.nav button.active{background:#fff;color:var(--deep);font-weight:700}.wrap{max-width:1180px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.span12{grid-column:span 12}.span8{grid-column:span 8}.span6{grid-column:span 6}.span4{grid-column:span 4}.metric{font-size:28px;font-weight:850;color:var(--deep)}.label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}.h1{font-size:23px;font-weight:850;margin:2px 0 14px}.h2{font-size:16px;font-weight:800;margin:0 0 12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stack{display:flex;flex-direction:column;gap:10px}.field{display:flex;flex-direction:column;gap:6px;min-width:180px;flex:1}.field label{font-size:12px;font-weight:700;color:var(--muted)}input,select,textarea{width:100%;border:1px solid #bfced0;border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}textarea{min-height:110px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(10,126,134,.12)}.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.primary{background:var(--teal);color:#fff}.secondary{background:#e8f4f4;color:var(--deep)}.danger{background:#ffebe9;color:var(--bad)}.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}.small{padding:6px 9px;font-size:12px}.badge{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:800;background:#e8f4f4;color:var(--deep)}.badge.ok{background:#e6f5ec;color:var(--ok)}.badge.warn{background:#fff3d9;color:var(--warn)}.badge.bad{background:#ffebe9;color:var(--bad)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-size:11px;text-transform:uppercase}.tablewrap{overflow:auto}.muted{color:var(--muted)}.note{border-left:4px solid var(--teal);background:#edf8f8;padding:10px 12px;border-radius:8px;font-size:13px}.warnbox{border-left-color:#d59a00;background:#fff8e6}.badbox{border-left-color:var(--bad);background:#fff0ef}.loginShell{min-height:100vh;background:radial-gradient(circle at top right,#0d6971,var(--deep) 45%,#041f22);display:flex;align-items:center;justify-content:center;padding:22px}.loginCard{width:min(430px,100%);background:#fff;border-radius:22px;padding:25px;box-shadow:0 25px 80px rgba(0,0,0,.35)}.logoMark{width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,var(--teal2),var(--deep));display:grid;place-items:center;color:white;font-weight:900;font-size:20px;margin-bottom:14px}.loginTitle{font-size:24px;font-weight:900;color:var(--deep)}.loginSub{color:var(--muted);font-size:13px;margin:6px 0 18px}.footer{padding:18px;text-align:center;color:var(--muted);font-size:11px}.split{display:flex;justify-content:space-between;gap:12px;align-items:center}.progress{height:9px;background:#e5eeee;border-radius:999px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal2))}.check{display:flex;gap:8px;align-items:flex-start}.check input{width:auto;margin-top:3px}.pillrow{display:flex;gap:7px;flex-wrap:wrap}.recipient{padding:7px 9px;border:1px solid var(--line);border-radius:9px;background:#fafcfc;font-size:12px}.msg{padding:10px;border-radius:12px;background:#f5f9f9;border:1px solid var(--line);margin:8px 0}.msg.in{border-left:4px solid var(--teal2)}.msg.out{border-left:4px solid #6d7f82}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.right{text-align:right}.kpiRow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0c2427;color:#fff;padding:11px 15px;border-radius:12px;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:90%;font-size:13px}.statusDot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#999;margin-right:5px}.statusDot.live{background:#17a45c}.statusDot.demo{background:#d39000}.dangerText{color:var(--bad)}
@media(max-width:800px){.span8,.span6,.span4{grid-column:span 12}.kpiRow{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}.card{padding:13px}.nav{padding-bottom:1px}.appbar{padding:12px}.h1{font-size:20px}table{min-width:650px}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" class="toast hidden"></div>
<script>
'use strict';
const STORE='t1xperts_bulk_p0_v1';
const nowIso=()=>new Date().toISOString();
const uid=()=>window.T1Native?.newId?.()||('id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const initial={session:{loggedIn:false,mfa:false,email:''},org:{id:'org-demo-clinic',name:'T1Xperts Demo Medical Centre',role:'Owner'},contacts:[{id:'c1',first:'John',last:'Citizen',mobile:'+61411111111',group:'Patients',optOut:false,status:'Pending'},{id:'c2',first:'Aisha',last:'Rahman',mobile:'+61422222222',group:'Patients',optOut:false,status:'Confirmed'},{id:'c3',first:'Sam',last:'Taylor',mobile:'+61433333333',group:'Staff',optOut:false,status:''}],messages:[],inbox:[],audit:[],senderIds:['T1Xperts'],defaultSender:'T1Xperts',subscription:{plan:'P0 Pilot',allowance:5000,used:0},settings:{gateway:'demo',endpoint:'https://uat.t1xperts.com.au/api/sms/v1/messages',token:'',timezone:'Australia/Melbourne'},view:'dashboard'};
let state=load();
function cloneInitial(){return JSON.parse(JSON.stringify(initial))}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE));return x?Object.assign(cloneInitial(),x,{session:{loggedIn:false,mfa:false,email:''}}):cloneInitial()}catch(e){return cloneInitial()}}
function save(){const x=JSON.parse(JSON.stringify(state));x.session={loggedIn:false,mfa:false,email:''};localStorage.setItem(STORE,JSON.stringify(x))}
function audit(action,detail){state.audit.unshift({id:uid(),at:nowIso(),action,detail});state.audit=state.audit.slice(0,250);save()}
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(window._tt);window._tt=setTimeout(()=>el.classList.add('hidden'),2400)}
function normalizeAU(raw){let s=String(raw||'').replace(/[^0-9+]/g,'');if(s.startsWith('+61'))return /^\+614\d{8}$/.test(s)?s:null;if(s.startsWith('61')){s='+'+s;return /^\+614\d{8}$/.test(s)?s:null}if(/^04\d{8}$/.test(s))return '+61'+s.slice(1);return null}
function gsmParts(t){const unicode=/[^\x00-\x7F]/.test(t);const single=unicode?70:160,multi=unicode?67:153,n=t.length;return{chars:n,parts:n===0?0:(n<=single?1:Math.ceil(n/multi)),unicode}}
function fmt(d){try{return new Intl.DateTimeFormat('en-AU',{dateStyle:'medium',timeStyle:'short',timeZone:state.settings.timezone}).format(new Date(d))}catch(e){return new Date(d).toLocaleString()}}
function statusBadge(s){const x=String(s||'').toLowerCase();let c=x.includes('deliver')||x==='confirmed'?'ok':x.includes('fail')||x==='blocked'||x==='cancelled'?'bad':x.includes('schedule')||x.includes('queue')||x==='pending'?'warn':'';return `<span class="badge ${c}">${esc(s||'—')}</span>`}
function app(){document.getElementById('root').innerHTML=state.session.loggedIn?appShell():login();processDueSchedules();if(state.session.loggedIn&&state.view==='send')setTimeout(()=>{messageStats();recipientPreview()},30)}
function login(){return `<div class="loginShell"><div class="loginCard"><div class="logoMark">T1</div><div class="loginTitle">T1Xperts Bulk Messenger</div><div class="loginSub">P0 Android client • Your Trusted Technology Partner</div>${state.session.mfa?`<div class="note">Demo MFA is enabled for this build. Enter <b>123456</b>.</div><div class="stack" style="margin-top:14px"><div class="field"><label>Verification code</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="123456"></div><button class="btn primary" onclick="verifyOtp()">Verify & Sign in</button><button class="btn secondary" onclick="state.session.mfa=false;app()">Back</button></div>`:`<div class="stack"><div class="field"><label>Email</label><input id="email" type="email" value="admin@t1xperts.com.au"></div><div class="field"><label>Password</label><input id="pass" type="password" value="P0-Demo-Only"></div><button class="btn primary" onclick="startLogin()">Continue</button></div><div class="note" style="margin-top:14px">This APK is a P0 client build. Authentication and carrier sending run in demo mode unless a T1Xperts backend is configured.</div>`}</div></div>`}
function startLogin(){const e=document.getElementById('email').value.trim(),p=document.getElementById('pass').value;if(!e||!p)return toast('Enter email and password');state.session={loggedIn:false,mfa:true,email:e};app()}
function verifyOtp(){if(document.getElementById('otp').value.trim()!=='123456')return toast('Demo code is 123456');state.session.loggedIn=true;state.session.mfa=false;audit('LOGIN','Demo MFA login completed');app()}
function logout(){audit('LOGOUT','User signed out');state.session={loggedIn:false,mfa:false,email:''};app()}
function appShell(){const items=[['dashboard','Dashboard'],['contacts','Contacts'],['send','Send'],['inbox','Inbox'],['history','History'],['settings','Settings']];return `<div class="appbar"><div class="split"><div><div class="brand">T1Xperts Bulk Messenger</div><div class="tag">${esc(state.org.name)} • ${esc(state.org.role)}</div></div><div style="font-size:11px"><span class="statusDot ${state.settings.gateway==='demo'?'demo':'live'}"></span>${state.settings.gateway==='demo'?'Demo':'Backend'}</div></div><div class="nav">${items.map(x=>`<button class="${state.view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}<button onclick="logout()">Sign out</button></div></div><main class="wrap">${renderView()}</main><div class="footer">T1Xperts • P0 client v${esc(window.T1Native?.getVersion?.()||'0.1.0-p0')} • ${esc(state.settings.timezone)}</div>`}
function go(v){state.view=v;save();app()}
function renderView(){return({dashboard,contacts:contactsView,send:sendView,inbox:inboxView,history:historyView,settings:settingsView}[state.view]||dashboard)()}
function dashboard(){const sent=state.messages.length,delivered=state.messages.filter(x=>x.status==='Delivered').length,inbound=state.inbox.length,opt=state.contacts.filter(x=>x.optOut).length,remaining=Math.max(0,state.subscription.allowance-state.subscription.used);return `<div class="h1">Dashboard</div><div class="grid"><div class="card span12"><div class="kpiRow"><div><div class="label">Outbound</div><div class="metric">${sent}</div></div><div><div class="label">Delivered</div><div class="metric">${delivered}</div></div><div><div class="label">Inbound</div><div class="metric">${inbound}</div></div><div><div class="label">Opt-outs</div><div class="metric">${opt}</div></div></div></div><div class="card span8"><div class="h2">Usage</div><div class="split"><div><b>${state.subscription.used.toLocaleString()}</b> / ${state.subscription.allowance.toLocaleString()} SMS parts</div><span class="badge">${esc(state.subscription.plan)}</span></div><div class="progress" style="margin-top:10px"><div style="width:${Math.min(100,state.subscription.allowance?state.subscription.used/state.subscription.allowance*100:100)}%"></div></div><div class="muted" style="font-size:12px;margin-top:7px">${remaining.toLocaleString()} parts remaining</div></div><div class="card span4"><div class="h2">Gateway</div><div><span class="statusDot ${state.settings.gateway==='demo'?'demo':'live'}"></span><b>${state.settings.gateway==='demo'?'Demo Gateway':'T1Xperts Backend'}</b></div><div class="muted" style="font-size:12px;margin-top:7px">${state.settings.gateway==='demo'?'No carrier traffic is sent.':'HTTPS backend hook enabled.'}</div></div><div class="card span6"><div class="h2">Appointment responses</div>${apptSummary()}</div><div class="card span6"><div class="h2">Recent activity</div>${state.audit.slice(0,6).map(a=>`<div class="msg"><b>${esc(a.action)}</b><div class="muted">${esc(a.detail)}</div><div class="muted" style="font-size:11px">${fmt(a.at)}</div></div>`).join('')||'<div class="muted">No activity yet.</div>'}</div></div>`}
function apptSummary(){return ['Confirmed','Cancelled','Pending'].map(s=>`<div class="split" style="margin:9px 0"><span>${s}</span>${statusBadge(s)}<b>${state.contacts.filter(x=>x.status===s).length}</b></div>`).join('')}
function contactsView(){return `<div class="h1">Contacts & Suppression</div><div class="grid"><div class="card span4"><div class="h2">Add contact</div><div class="stack"><div class="field"><label>First name</label><input id="cf"></div><div class="field"><label>Last name</label><input id="cl"></div><div class="field"><label>Australian mobile</label><input id="cm" placeholder="04xx xxx xxx"></div><div class="field"><label>Group</label><input id="cg" value="Patients"></div><button class="btn primary" onclick="addContact()">Add contact</button></div><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><div class="h2">Import CSV</div><input id="csv" type="file" accept=".csv,text/csv" onchange="importCsv(this.files[0])"><div class="muted" style="font-size:11px;margin-top:7px">Columns: first,last,mobile,group. Invalid/non-AU mobiles are rejected.</div></div><div class="card span8"><div class="split"><div class="h2">Contacts (${state.contacts.length})</div><button class="btn secondary small" onclick="downloadCsvTemplate()">CSV template</button></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Mobile</th><th>Group</th><th>Appointment</th><th>Suppression</th><th></th></tr></thead><tbody>${state.contacts.map(c=>`<tr><td><b>${esc(c.first)} ${esc(c.last)}</b></td><td class="mono">${esc(c.mobile)}</td><td>${esc(c.group)}</td><td>${statusBadge(c.status)}</td><td>${c.optOut?'<span class="badge bad">OPTED OUT</span>':'<span class="badge ok">Active</span>'}</td><td><button class="btn ${c.optOut?'secondary':'danger'} small" onclick="toggleOpt('${c.id}')">${c.optOut?'Restore':'Opt out'}</button> <button class="btn secondary small" onclick="removeContact('${c.id}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div></div>`}
function addContact(){const mobile=normalizeAU(document.getElementById('cm').value);if(!mobile)return toast('Enter a valid Australian mobile number');if(state.contacts.some(x=>x.mobile===mobile))return toast('That mobile already exists');const c={id:uid(),first:document.getElementById('cf').value.trim()||'Customer',last:document.getElementById('cl').value.trim(),mobile,group:document.getElementById('cg').value.trim()||'General',optOut:false,status:''};state.contacts.push(c);audit('CONTACT_ADD',mobile);save();app();toast('Contact added')}
function toggleOpt(id){const c=state.contacts.find(x=>x.id===id);if(!c)return;c.optOut=!c.optOut;audit(c.optOut?'OPTOUT_MANUAL':'OPTOUT_RESTORE',c.mobile);save();app()}
function removeContact(id){const c=state.contacts.find(x=>x.id===id);state.contacts=state.contacts.filter(x=>x.id!==id);audit('CONTACT_DELETE',c?.mobile||id);save();app()}
function parseCsvLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out}
function importCsv(file){if(!file)return;const r=new FileReader();r.onload=()=>{const lines=String(r.result).split(/\r?\n/).filter(Boolean);if(!lines.length)return;const h=parseCsvLine(lines[0]).map(x=>x.trim().toLowerCase());let added=0,rejected=0;for(const line of lines.slice(1)){const p=parseCsvLine(line),obj={};h.forEach((k,i)=>obj[k]=p[i]||'');const m=normalizeAU(obj.mobile||obj.phone||obj.number);if(!m||state.contacts.some(x=>x.mobile===m)){rejected++;continue}state.contacts.push({id:uid(),first:obj.first||obj.firstname||'Customer',last:obj.last||obj.lastname||'',mobile:m,group:obj.group||'General',optOut:false,status:''});added++}audit('CONTACT_IMPORT',`${added} added, ${rejected} rejected`);save();app();toast(`${added} added • ${rejected} rejected`)};r.readAsText(file)}
function downloadCsvTemplate(){const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent('first,last,mobile,group\nJohn,Citizen,0411111111,Patients\n');a.download='t1xperts-contact-template.csv';a.click()}
function sendView(){const groups=[...new Set(state.contacts.map(c=>c.group))];return `<div class="h1">Send SMS</div><div class="grid"><div class="card span8"><div class="stack"><div class="row"><div class="field"><label>Audience</label><select id="aud" onchange="recipientPreview()"><option value="all">All active contacts</option>${groups.map(g=>`<option value="g:${esc(g)}">Group: ${esc(g)}</option>`).join('')}<option value="manual">Manual number</option></select></div><div class="field"><label>Manual AU mobile</label><input id="manual" placeholder="04xx xxx xxx" oninput="recipientPreview()"></div></div><div class="row"><div class="field"><label>Sender ID</label><select id="sender">${state.senderIds.map(s=>`<option ${s===state.defaultSender?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Send time</label><input id="when" type="datetime-local"></div></div><div class="field"><label>Message</label><textarea id="body" oninput="messageStats()" placeholder="Hi {{first}}, this is a reminder of your appointment tomorrow. Reply YES to confirm or NO to cancel."></textarea></div><div class="split"><div id="stats" class="muted">0 characters • 0 SMS parts</div><div id="rpreview" class="muted"></div></div><div class="check"><input type="checkbox" id="marketing"><label for="marketing">Promotional/marketing message. Suppression and opt-out controls remain enforced.</label></div><button class="btn primary" onclick="sendMessages()">Review & Queue</button></div></div><div class="card span4"><div class="h2">P0 compliance gate</div><div class="note">Opted-out contacts are automatically blocked. Australian mobile numbers are normalised before queueing.</div><div class="note warnbox" style="margin-top:10px">The demo gateway does not send real carrier traffic. Configure the T1Xperts backend under Settings for live integration testing.</div><div class="h2" style="margin-top:18px">Recipients</div><div id="recipientList" class="pillrow"></div></div></div>`}
function selectedContacts(){const aud=document.getElementById('aud')?.value||'all';let list=[];if(aud==='all')list=state.contacts.filter(c=>!c.optOut);else if(aud.startsWith('g:'))list=state.contacts.filter(c=>c.group===aud.slice(2)&&!c.optOut);else if(aud==='manual'){const m=normalizeAU(document.getElementById('manual')?.value);if(m)list=[{id:'manual',first:'Customer',last:'',mobile:m,group:'Manual',optOut:false,status:''}]}return list}
function recipientPreview(){const list=selectedContacts(),p=document.getElementById('rpreview');if(p)p.textContent=list.length+' recipient'+(list.length===1?'':'s');const el=document.getElementById('recipientList');if(el)el.innerHTML=list.slice(0,15).map(c=>`<span class="recipient">${esc(c.first)} • ${esc(c.mobile)}</span>`).join('')+(list.length>15?`<span class="recipient">+${list.length-15} more</span>`:'')}
function messageStats(){const b=document.getElementById('body')?.value||'',s=gsmParts(b),el=document.getElementById('stats');if(el)el.textContent=`${s.chars} characters • ${s.parts} SMS part${s.parts===1?'':'s'}${s.unicode?' • Unicode':''}`}
function merge(body,c){return body.replace(/{{\s*first\s*}}/gi,c.first||'Customer').replace(/{{\s*last\s*}}/gi,c.last||'').replace(/{{\s*mobile\s*}}/gi,c.mobile||'')}
function sendMessages(){const list=selectedContacts(),body=document.getElementById('body').value.trim(),sender=document.getElementById('sender').value,when=document.getElementById('when').value;if(!list.length)return toast('No valid active recipients');if(!body)return toast('Write a message first');const partsPer=gsmParts(body).parts||1,totalParts=partsPer*list.length;if(state.subscription.used+totalParts>state.subscription.allowance)return toast('Plan allowance exceeded');const scheduledAt=when?new Date(when).toISOString():null,future=scheduledAt&&new Date(scheduledAt)>new Date(),batch=uid();for(const c of list){const personalised=merge(body,c),parts=gsmParts(personalised).parts||1,m={id:uid(),batch,contactId:c.id,mobile:c.mobile,name:(c.first+' '+c.last).trim(),sender,body:personalised,parts,status:future?'Scheduled':'Queued',createdAt:nowIso(),scheduledAt:future?scheduledAt:null,gateway:state.settings.gateway};state.messages.unshift(m);state.subscription.used+=parts;if(!future)dispatch(m)}audit('CAMPAIGN_QUEUE',`${list.length} recipients • ${totalParts} parts • ${future?'scheduled':'immediate'}`);save();state.view='history';app();toast(future?'Campaign scheduled':'Campaign queued')}
function dispatch(m){if(state.settings.gateway==='demo'){m.status='Queued';save();setTimeout(()=>{const x=state.messages.find(v=>v.id===m.id);if(x){x.status='Delivered';x.deliveredAt=nowIso();audit('DLR_DELIVERED',x.mobile);save();if(state.view==='history'||state.view==='dashboard')app()}},700+Math.random()*900);return}if(!state.settings.endpoint.startsWith('https://')){m.status='Failed';m.error='Invalid HTTPS backend endpoint';save();return}const req='api-'+m.id;window._apiReq=window._apiReq||{};window._apiReq[req]=m.id;const payload={organisationId:state.org.id,idempotencyKey:m.id,recipient:m.mobile,senderId:m.sender,body:m.body,scheduledAt:m.scheduledAt};try{window.T1Native.postJson(req,state.settings.endpoint,state.settings.token,JSON.stringify(payload));m.status='Queued';save()}catch(e){m.status='Failed';m.error=e.message;save()}}
window.t1OnNativeApiResult=function(requestId,status,body){const id=window._apiReq?.[requestId],m=state.messages.find(x=>x.id===id);if(!m)return;m.status=status>=200&&status<300?'Submitted':'Failed';m.providerStatus=status;m.providerResponse=body;audit(m.status==='Submitted'?'BACKEND_SUBMIT':'BACKEND_FAIL',`${m.mobile} • HTTP ${status}`);save();if(state.view==='history')app()}
function processDueSchedules(){let changed=false;for(const m of state.messages){if(m.status==='Scheduled'&&m.scheduledAt&&new Date(m.scheduledAt)<=new Date()){m.status='Queued';dispatch(m);audit('SCHEDULE_DUE',m.mobile);changed=true}}if(changed)save()}
function inboxView(){return `<div class="h1">Two-way Inbox & Appointment Replies</div><div class="grid"><div class="card span4"><div class="h2">Simulate inbound reply</div><div class="stack"><div class="field"><label>Contact</label><select id="ic">${state.contacts.map(c=>`<option value="${c.id}">${esc(c.first)} • ${esc(c.mobile)}</option>`).join('')}</select></div><div class="field"><label>Reply text</label><input id="it" placeholder="YES / NO / STOP"></div><button class="btn primary" onclick="receiveInbound()">Receive reply</button></div><div class="note" style="margin-top:14px">Production inbound SMS must arrive through a validated T1Xperts backend webhook. This control exercises the P0 reply workflow without carrier traffic.</div></div><div class="card span8"><div class="h2">Inbox</div>${state.inbox.map(i=>`<div class="msg in"><div class="split"><b>${esc(i.name||i.mobile)}</b>${statusBadge(i.action)}</div><div style="margin-top:6px">${esc(i.body)}</div><div class="muted" style="font-size:11px;margin-top:5px">${fmt(i.at)} • ${esc(i.mobile)}</div></div>`).join('')||'<div class="muted">No replies yet.</div>'}</div></div>`}
function receiveInbound(){const c=state.contacts.find(x=>x.id===document.getElementById('ic').value),body=document.getElementById('it').value.trim();if(!c||!body)return toast('Select a contact and enter a reply');const u=body.toUpperCase();let action='Received';if(/^YES\b/.test(u)){c.status='Confirmed';action='Confirmed'}else if(/^NO\b/.test(u)){c.status='Cancelled';action='Cancelled'}else if(/^STOP\b/.test(u)||/^UNSUBSCRIBE\b/.test(u)){c.optOut=true;action='Opt-out'}state.inbox.unshift({id:uid(),contactId:c.id,mobile:c.mobile,name:(c.first+' '+c.last).trim(),body,at:nowIso(),action});audit('INBOUND_'+action.toUpperCase().replace(/[^A-Z]/g,'_'),`${c.mobile} • ${body}`);save();app();toast('Inbound reply processed')}
function historyView(){return `<div class="h1">Queue, Delivery & History</div><div class="card"><div class="split"><div class="h2">Messages (${state.messages.length})</div><button class="btn secondary small" onclick="processDueSchedules();app()">Process due schedules</button></div><div class="tablewrap"><table><thead><tr><th>Recipient</th><th>Message</th><th>Parts</th><th>Gateway</th><th>Status</th><th>Time</th><th></th></tr></thead><tbody>${state.messages.map(m=>`<tr><td><b>${esc(m.name||'Customer')}</b><br><span class="mono">${esc(m.mobile)}</span></td><td style="max-width:330px">${esc(m.body)}</td><td>${m.parts}</td><td>${esc(m.gateway)}</td><td>${statusBadge(m.status)}${m.error?`<div class="dangerText" style="font-size:11px">${esc(m.error)}</div>`:''}</td><td>${fmt(m.scheduledAt||m.createdAt)}</td><td>${m.status==='Failed'?`<button class="btn secondary small" onclick="retryMsg('${m.id}')">Retry</button>`:''}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">No messages yet.</td></tr>'}</tbody></table></div></div>`}
function retryMsg(id){const m=state.messages.find(x=>x.id===id);if(!m)return;m.status='Queued';delete m.error;dispatch(m);audit('MESSAGE_RETRY',m.mobile);save();app()}
function settingsView(){return `<div class="h1">Settings, Tenant & P0 Status</div><div class="grid"><div class="card span6"><div class="h2">Organisation</div><div class="stack"><div class="field"><label>Organisation name</label><input id="on" value="${esc(state.org.name)}"></div><div class="field"><label>Role</label><select id="or"><option ${state.org.role==='Owner'?'selected':''}>Owner</option><option ${state.org.role==='Admin'?'selected':''}>Admin</option><option ${state.org.role==='Sender'?'selected':''}>Sender</option><option ${state.org.role==='Read only'?'selected':''}>Read only</option></select></div><button class="btn secondary" onclick="saveOrg()">Save organisation</button></div></div><div class="card span6"><div class="h2">Gateway abstraction</div><div class="stack"><div class="field"><label>Gateway</label><select id="gw" onchange="state.settings.gateway=this.value;save();app()"><option value="demo" ${state.settings.gateway==='demo'?'selected':''}>Demo Gateway</option><option value="backend" ${state.settings.gateway==='backend'?'selected':''}>T1Xperts HTTPS Backend</option></select></div><div class="field"><label>Backend send endpoint</label><input id="ep" value="${esc(state.settings.endpoint)}"></div><div class="field"><label>Bearer token (session use)</label><input id="tok" type="password" placeholder="Not embedded in APK"></div><button class="btn secondary" onclick="saveGateway()">Save gateway</button></div></div><div class="card span6"><div class="h2">Sender IDs</div><div class="pillrow">${state.senderIds.map(s=>`<span class="recipient">${esc(s)} ${s===state.defaultSender?'• default':''}</span>`).join('')}</div><div class="row" style="margin-top:10px"><input id="newsender" placeholder="Business sender ID"><button class="btn secondary" onclick="addSender()">Add</button></div><div class="field" style="margin-top:10px"><label>Default sender</label><select id="defsender" onchange="state.defaultSender=this.value;save()">${state.senderIds.map(s=>`<option ${s===state.defaultSender?'selected':''}>${esc(s)}</option>`).join('')}</select></div></div><div class="card span6"><div class="h2">Subscription</div><div class="row"><div class="field"><label>Plan</label><input id="plan" value="${esc(state.subscription.plan)}"></div><div class="field"><label>Monthly allowance</label><input id="allow" type="number" value="${state.subscription.allowance}"></div></div><button class="btn secondary" onclick="savePlan()">Save pilot plan</button><div class="muted" style="font-size:11px;margin-top:8px">Used: ${state.subscription.used} parts</div></div><div class="card span12"><div class="h2">P0 readiness matrix</div>${p0Matrix()}</div><div class="card span12"><div class="split"><div class="h2">Audit log</div><button class="btn danger small" onclick="clearDemo()">Reset demo data</button></div><div class="tablewrap"><table><thead><tr><th>Time</th><th>Event</th><th>Detail</th></tr></thead><tbody>${state.audit.slice(0,80).map(a=>`<tr><td>${fmt(a.at)}</td><td>${esc(a.action)}</td><td>${esc(a.detail)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No audit events yet.</td></tr>'}</tbody></table></div></div></div>`}
function p0Matrix(){const rows=[['Authentication + MFA client flow','Implemented in APK (demo auth)','ok'],['Tenant/workspace context + RBAC surface','Implemented client-side; server enforcement pending','warn'],['Contacts + CSV import + AU validation','Implemented','ok'],['Suppression + STOP enforcement','Implemented client workflow','ok'],['Bulk send + scheduling + queue','Implemented client workflow','ok'],['Gateway abstraction','Demo + HTTPS backend adapter','ok'],['Carrier/provider live send','Requires T1Xperts backend/provider credentials','warn'],['Delivery receipt webhook','Requires backend webhook endpoint','warn'],['Two-way YES/NO/STOP processing','Implemented client workflow; live webhook pending','warn'],['Subscription allowance','Implemented client guard; server enforcement pending','warn'],['Audit trail','Implemented local; central immutable audit pending','warn'],['Backups / 99% uptime','Backend/platform responsibility','warn']];return `<div class="tablewrap"><table><thead><tr><th>P0 item</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td><span class="badge ${r[2]}">${r[1]}</span></td></tr>`).join('')}</tbody></table></div>`}
function saveOrg(){state.org.name=document.getElementById('on').value.trim()||state.org.name;state.org.role=document.getElementById('or').value;audit('ORG_UPDATE',state.org.name);save();app()}
function saveGateway(){const ep=document.getElementById('ep').value.trim();if(state.settings.gateway==='backend'&&!ep.startsWith('https://'))return toast('Backend endpoint must use HTTPS');state.settings.endpoint=ep;state.settings.token=document.getElementById('tok').value;audit('GATEWAY_CONFIG',state.settings.gateway);save();app();toast('Gateway settings saved')}
function addSender(){const s=document.getElementById('newsender').value.trim();if(!s)return;if(!state.senderIds.includes(s))state.senderIds.push(s);audit('SENDER_ADD',s);save();app()}
function savePlan(){state.subscription.plan=document.getElementById('plan').value.trim()||'Pilot';state.subscription.allowance=Math.max(0,parseInt(document.getElementById('allow').value||'0'));audit('PLAN_UPDATE',`${state.subscription.plan} • ${state.subscription.allowance}`);save();app()}
function clearDemo(){localStorage.removeItem(STORE);state=cloneInitial();app();toast('Demo data reset')}
setInterval(processDueSchedules,15000);app();
</script>
</body>
</html>
